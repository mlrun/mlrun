name: Create Release Candidate
run-name: Create Release Candidate 

permissions:
  contents: write

on:
  push:
    branches:
      - feature/mlrun-release-procedure
  workflow_dispatch:
    inputs:
      release_type:
        description: 'The type of release to create (major, minor, patch, or none)'
        required: false
        default: 'patch'
      source_branch:
        description: 'The source branch to create the release candidate from'
        required: false
        default: 'development'
jobs:
  Create-Release-Candidate  :
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bumpversion==0.6.0

      - name: Create Release Candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use inputs if available (manual trigger), otherwise use defaults (push trigger)
          SOURCE_BRANCH: ${{ inputs.source_branch || 'feature/mlrun-release-procedure' }}
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
        run: |
          echo "🎯 Trigger: ${{ github.event_name }}"
          echo "📂 Source branch: $SOURCE_BRANCH"
          echo "🏷️ Release type: $RELEASE_TYPE"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Switch to source branch
          git pull
          git checkout $SOURCE_BRANCH
          
          # Bump version
          bumpversion $RELEASE_TYPE
          current_version=$(bumpversion --dry-run --list patch | grep current_version | sed 's/current_version=//')
          echo "📦 New current version: $current_version"
          
          # Create release branch
          branch_name=release/v$current_version
          echo "🌿 Creating branch: $branch_name"
          git checkout -b $branch_name
          git push origin $branch_name
          
          echo "✅ Release candidate branch created successfully!"
          # TODO add changelog generation here as needed
          # gh release create "rc-v$current_version" --repo mlrun/mlrun --title "Release Candidate $current_version" --notes "Automated release candidate created by GitHub Actions" --prerelease

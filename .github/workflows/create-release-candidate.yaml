name: Create Release Candidate
run-name: Create Release Candidate

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'The type of release to create (major, minor, patch, or none)'
        required: false
        default: ''
      source_branch:
        description: 'The source branch to create the release candidate from'
        required: false
        default: 'development'
jobs:
  Create-Release-Candidate  :
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Get Version
        uses: ./.github/actions/get-version
        id: get-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt

      - name: Create Release Candidate
        id: create-release-candidate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use inputs if available (manual trigger), otherwise use defaults (push trigger)
          SOURCE_BRANCH: ${{ inputs.source_branch || 'feature/mlrun-release-procedure' }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          echo "🎯 Trigger: ${{ github.event_name }}"
          echo "📂 Source branch: $SOURCE_BRANCH"
          echo "🏷️ Release type: $RELEASE_TYPE"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to source branch
          git pull
          git checkout $SOURCE_BRANCH

          next_version=${{ steps.get-version.outputs.next_version }}
          echo "📦 New version: $next_version"

          # Create release branch
          branch_name=release/v$next_version
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "🌿 Creating branch: $branch_name"
          git checkout -b $branch_name
          git push --set-upstream origin $branch_name

          # Bump version
          if [ -n "$RELEASE_TYPE" ]; then
            cz bump --increment "$RELEASE_TYPE"
          else
            cz bump
          fi
          git push
          echo "✅ Release candidate branch created successfully!"
          # TODO add changelog generation here as needed
          # gh release create "rc-v$current_version" --repo mlrun/mlrun --title "Release Candidate $current_version" --notes "Automated release candidate created by GitHub Actions" --prerelease

      - name: Trigger build-release-candidate workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.create-release-candidate.outputs.branch_name }}
        run: |
          gh workflow run build-release-candidate.yaml \
          --repo "${{ github.repository }}" \
          --ref "$BRANCH_NAME"

name: Test get_demos.py

run-name: get_demos.py (${{ github.ref_name }})

on:
  push:

permissions:
  contents: read

jobs:
  get-demos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch history and tags, so version resolution based on git tags can work
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests packaging tqdm

      - name: Resolve mlrun version
        id: resolve-version
        shell: bash
        run: |
          set -euo pipefail

          mlrun_version="1.11.0"
          # if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
          #   mlrun_version="${GITHUB_REF_NAME#v}"
          # else
          #   # version_file.py may output local version segment (e.g. "+my-feature").
          #   # Strip it to keep get_demos.py input in the expected format.
          #   mlrun_version="$(python automation/version/version_file.py current-version | sed 's/+.*$//')"
          # fi

          echo "mlrun_version=$mlrun_version" >> "$GITHUB_OUTPUT"
          echo "Resolved mlrun_version: $mlrun_version"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Show configuration
        shell: bash
        run: |
          echo "=== get_demos.py Configuration ==="
          echo "mlrun_version: ${{ steps.resolve-version.outputs.mlrun_version }}"
          echo "org: mlrun (default from get_demos.py)"
          echo "dest: demos (default from get_demos.py)"
          if [[ -n "${{ steps.app-token.outputs.token }}" ]]; then
            echo "token_type: GitHub App installation token"
            echo "token_available: yes"
          else
            echo "token_type: github.token (workflow default)"
            if [[ -n "${{ github.token }}" ]]; then
              echo "token_available: yes"
            else
              echo "token_available: no"
            fi
          fi
          echo "=================================="

      - name: Run get_demos.py
        env:
          # Use GitHub App token if available, otherwise fall back to the workflow token
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          python automation/scripts/get_demos.py "${{ steps.resolve-version.outputs.mlrun_version }}"

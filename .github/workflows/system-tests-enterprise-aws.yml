name: Test AWS cred

permissions:
  contents: read
  id-token: write   # This is required for requesting the AWS OIDC JWT


env:
  MLRUN_PYTHON_PACKAGE_INSTALLER: uv

on:
  push:
    branches:
      - 'feature/aws_access_key_control'

  schedule:

    # * is a special character in YAML so you have to quote this string
    # Run the system tests every 8 hours (cron hours should divide 24 equally, otherwise there will be an overlap at the end of the day)
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      docker_registry:
        description: 'Docker registry to pull images from (default: ghcr.io/, use registry.hub.docker.com/ for docker hub)'
        required: true
        default: 'ghcr.io/'
      clean_resources_in_teardown:
        description: 'Clean resources created by test (like project) in each test teardown (default: true - perform clean)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      override_iguazio_version:
        description: 'Override the configured target system iguazio version (leave empty to resolve automatically)'
        required: false

# concurrency: one-at-a-time

jobs:
  system-test-cleanup:
    name: System Test Cleanup
    runs-on:
      group: mlrun-ce
    timeout-minutes: 10
    # let's not run this on every fork, change to your fork when developing
    if: github.repository == 'mlrun/mlrun' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v5
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
      with:
        role-to-assume: arn:aws:iam::939152069779:role/MLRun-S3-Read
        role-session-name: mlrun-system-tests-${{ github.run_id }}
        aws-region: us-east-1
    # Test AWS S3 access
    - name: Test aws s3 list
      run: |
        echo "Testing S3 bucket listing..."
        aws s3 ls
        echo "Testing read from igz-public bucket..."
        aws s3 ls s3://igz-public/
        echo "Trying to read a file from igz-public bucket..."
        aws s3 cp s3://igz-public/node-shell-daemonset.yaml ./ || echo "File not found or no access"   
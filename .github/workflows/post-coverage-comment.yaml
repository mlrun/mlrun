name: Post Coverage Comment

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  post_coverage_comment:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download coverage artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          name: coverage-markdown-report
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          path: coverage_artifacts


      - name: Locate coverage file
        id: file
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "coverage_artifacts/diff_coverage.md" ]; then
            echo "Error: diff_coverage.md not found in coverage_artifacts/"
            ls -R coverage_artifacts || true
            exit 1
          fi

          cp coverage_artifacts/diff_coverage.md diff_coverage.md
          echo "Found coverage file at: coverage_artifacts/diff_coverage.md"

      - name: Get PR number
        id: pr
        shell: bash
        env:
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(echo "${PULL_REQUESTS_JSON}" | jq -r '.[0].number // empty')

          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "Error: No PR number found in workflow_run payload"
            exit 1
          fi

          echo "Found PR number: ${PR_NUMBER}"
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Read coverage report
        id: read_report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'REPORT_BODY<<EOF'
            cat diff_coverage.md
            echo 'EOF'
          } >> "$GITHUB_ENV"


      - name: Post Comment to PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          message: |
            ## 📊 Diff Coverage Report
            <details>
            <summary>📂 Click to view full coverage details</summary>

            ${{ env.REPORT_BODY }}

            </details>
          comment-tag: coverage_report
          mode: recreate


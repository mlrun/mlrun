name: "PR Title Checker"

permissions:
  contents: read

  pull-requests: write  # Needed so pr-title-checker can post a comment or set a PR status when title doesn't match rules

on:

  # when opening PRs from forks
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dev requirements
        run: |
          pip install -r ci-requirements.txt

      - name: Check PR title with committizen
        run: |
          # This is to avoid that a PR got squashed and the commit message doesn't follow conventional commits
          cz check -m "${{ github.event.pull_request.title }}"

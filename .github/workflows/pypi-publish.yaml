name: Publish Python Package to PyPI
run-name: Publish MLRun ${{ inputs.version }} to PyPI

permissions:
  contents: read
  id-token: write  # For trusted publishing

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.13.205)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        default: 'pypi'
        type: choice
        options: ['testpypi', 'pypi']
      force_rebuild:
        description: 'Force rebuild package (otherwise use artifacts)'
        default: false
        type: boolean

jobs:
  # Try to find existing build artifacts first
  find-artifacts:
    name: Find Build Artifacts
    runs-on: ubuntu-latest
    outputs:
      artifact_found: ${{ steps.search.outputs.artifact_found }}
      run_id: ${{ steps.search.outputs.run_id }}
    steps:
      - name: Search for build artifacts
        id: search
        if: ${{ !inputs.force_rebuild }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Searching for existing build artifacts for version ${{ inputs.version }}..."
          
          # Search for recent workflow runs that built this version
          runs=$(gh api repos/${{ github.repository }}/actions/runs \
            --jq '.workflow_runs[] | select(.name | contains("Build")) | select(.conclusion == "success") | .id' \
            | head -10)
          
          artifact_found="false"
          run_id=""
          
          for run in $runs; do
            echo "🔍 Checking run ID: $run"
            artifacts=$(gh api repos/${{ github.repository }}/actions/runs/$run/artifacts \
              --jq '.artifacts[] | select(.name | contains("python-package")) | .name')
            
            if [ -n "$artifacts" ]; then
              echo "✅ Found artifacts in run $run: $artifacts"
              artifact_found="true"
              run_id="$run"
              break
            fi
          done
          
          echo "artifact_found=$artifact_found" >> $GITHUB_OUTPUT
          echo "run_id=$run_id" >> $GITHUB_OUTPUT

  # Build package if no artifacts found or force rebuild
  build-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: find-artifacts
    if: ${{ inputs.force_rebuild || needs.find-artifacts.outputs.artifact_found == 'false' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up uv
        uses: astral-sh/setup-uv@latest
        
      - name: Build package
        env:
          MLRUN_VERSION: ${{ inputs.version }}
        run: |
          echo "🔨 Building MLRun package version $MLRUN_VERSION"
          uv build --wheel --sdist
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ inputs.version }}
          path: dist/
          retention-days: 30

  # Download existing artifacts if available
  download-artifacts:
    name: Download Existing Artifacts
    runs-on: ubuntu-latest
    needs: find-artifacts
    if: ${{ !inputs.force_rebuild && needs.find-artifacts.outputs.artifact_found == 'true' }}
    steps:
      - name: Download existing artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading existing artifacts from run ${{ needs.find-artifacts.outputs.run_id }}"
          gh run download ${{ needs.find-artifacts.outputs.run_id }} --repo ${{ github.repository }}
          
      - name: Re-upload for this workflow
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ inputs.version }}
          path: "*/dist/"

  # Publish to PyPI
  publish-to-pypi:
    name: Publish to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [find-artifacts, build-package, download-artifacts]
    if: always() && (needs.build-package.result == 'success' || needs.download-artifacts.result == 'success')
    environment: ${{ inputs.environment }}
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-${{ inputs.version }}
          path: dist/
          
      - name: Set up uv
        uses: astral-sh/setup-uv@latest
        
      - name: Verify package contents
        run: |
          echo "📦 Package contents:"
          ls -la dist/
          
      - name: Publish to ${{ inputs.environment }}
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          echo "🚀 Publishing MLRun ${{ inputs.version }} to ${{ inputs.environment }}"
          
          if [ "${{ inputs.environment }}" = "testpypi" ]; then
            uv publish --repository testpypi dist/*
          else
            # For production PyPI - could use trusted publishing here
            uv publish dist/*
          fi
          
          echo "✅ Successfully published to ${{ inputs.environment }}!"

  # Validate publication
  validate-publication:
    name: Validate Publication
    runs-on: ubuntu-latest
    needs: publish-to-pypi
    steps:
      - name: Wait and validate
        run: |
          echo "⏳ Waiting 2 minutes for package to be available..."
          sleep 120
          
          echo "🔍 Attempting to install published package..."
          if [ "${{ inputs.environment }}" = "testpypi" ]; then
            pip install -i https://test.pypi.org/simple/ mlrun==${{ inputs.version }} || echo "⚠️ Package not yet available on TestPyPI"
          else
            pip install mlrun==${{ inputs.version }} || echo "⚠️ Package not yet available on PyPI"
          fi
          
          echo "✅ Validation complete!"
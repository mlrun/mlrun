name: Create Release Candidate
run-name: Create Release Candidate 

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Whether to mark the release as a prerelease'
        required: false
        default: 'true'
      dry_run:
        description: 'Whether to run semantic-release in dry-run mode'
        required: false
        default: 'false'
jobs:
  build-mlrun:
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    name: Build MLRun
    uses: ./.github/workflows/build.yaml
    secrets: inherit
  npm install -g semantic-release@24.2.9



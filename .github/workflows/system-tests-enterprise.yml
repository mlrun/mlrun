name: System Tests Enterprise

permissions:
  contents: read
  id-token: write   # This is required for requesting the AWS OIDC JWT


env:
  MLRUN_PYTHON_PACKAGE_INSTALLER: uv
  # AWS Configuration
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::939152069779:role/MLRun-S3-Read

on:
  push:
    branches:
      - '.+-system-tests'

  schedule:

    # * is a special character in YAML so you have to quote this string
    # Run the system tests every 8 hours (cron hours should divide 24 equally, otherwise there will be an overlap at the end of the day)
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      docker_registry:
        description: 'Docker registry to pull images from (e.g ghcr.io/, or registry.hub.docker.com/ for docker hub).'
        required: true
        default: 'ghcr.io/'
      clean_resources_in_teardown:
        description: 'Clean resources created by test (like project) in each test teardown (default: true - perform clean)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      override_iguazio_version:
        description: 'Override the configured target system iguazio version (leave empty to resolve automatically)'
        required: false

concurrency: one-at-a-time

jobs:
  system-test-cleanup:
    name: System Test Cleanup
    runs-on: [ self-hosted, Linux, mlrun-igz-ci ]
    container:
      image: gcr.io/iguazio/ubuntu:latest
    timeout-minutes: 10
    # let's not run this on every fork, change to your fork when developing
    if: github.repository == 'mlrun/mlrun' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: |
        apt-get update -qqy && apt-get install -y sshpass
    - name: cleanup docker images from registries
      # SSH to datanode and delete all docker images created by the system tests by restarting the docker-registry
      # deployment and the datanode docker-registry
      run: |
        sshpass \
          -p "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          ssh \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=180 \
          -o ServerAliveCountMax=3 \
          ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}@${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }} \
          kubectl -n default-tenant rollout restart deployment docker-registry

        sshpass \
          -p "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          scp \
          automation/system_test/cleanup.py \
          ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}@${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }}:/home/iguazio/cleanup.py

        # cleanup.py needs aiohttp and click
        sshpass \
          -p "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          ssh \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=180 \
          -o ServerAliveCountMax=3 \
          ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}@${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }} \
          /bin/python3 -m pip install --user -q aiohttp click

        sshpass \
          -p "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          ssh \
          -o StrictHostKeyChecking=no \
          -o ServerAliveInterval=180 \
          -o ServerAliveCountMax=3 \
          ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}@${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }} \
            LC_ALL=en_US.utf8 LANG=en_US.utf8 /bin/python3 \
              /home/iguazio/cleanup.py \
              docker-images \
              http://localhost:8009 \
              igz0.docker_registry.0 \
              "ghcr.io/mlrun/mlrun-api,ghcr.io/mlrun/mlrun-ui,ghcr.io/mlrun/mlrun,ghcr.io/mlrun/mlrun-kfp,ghcr.io/mlrun/log-collector"

  prepare-system-tests-enterprise-ci:
    # When increasing the timeout make sure it's not larger than the schedule cron interval
    timeout-minutes: 55
    name: Prepare System Tests Enterprise
    runs-on: [ self-hosted, Linux, mlrun-igz-ci ]
    container:
      image: gcr.io/iguazio/python:3.11
    needs: [system-test-cleanup]
    # let's not run this on every fork, change to your fork when developing
    if: github.repository == 'mlrun/mlrun' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        apt-get update -qqy && apt-get install -y sshpass jq curl gnupg nodejs
    - uses: actions/setup-node@v7
      with:
        node-version: 18
    - name: Configure AWS credentials
      id: creds
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        role-session-name: mlrun-system-tests-${{ github.run_id }}
        aws-region: ${{ env.AWS_REGION }}
        output-credentials: true

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # 10.3.2
      with:
        enable-cache: true
        python-version: 3.11
        cache-dependency-glob: "**/*requirements*.txt"

    - name: Ensure persistent CI dir exists on data node
      run: |
        sshpass \
          -p "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          ssh \
          -o StrictHostKeyChecking=no \
          ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}@${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }} \
          mkdir -p /home/iguazio/ci

    - name: Copy state branch file from remote
      run: |
        if ! sshpass \
          -p "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          scp \
          -o StrictHostKeyChecking=no \
          ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}@${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }}:/home/iguazio/ci/system-tests-branches-list.txt \
          system-tests-branches-list.txt 2>/dev/null; then
          echo "remote branch list not found - seeding from repo default automation/system_test/system-tests-branches-list.txt"
          cp automation/system_test/system-tests-branches-list.txt system-tests-branches-list.txt
        fi

    - name: Resolve Branch To Run System Tests
      id: current-branch
      shell: bash
      # we store a file named /home/iguazio/ci/system-tests-branches-list.txt which contains a list of branches to run system tests
      # on the branches are separated with commas, so each run we pop the first branch in the list and append it to the
      # end of the list.
      # This mechanism allows us to run on multiple branches without the need to modify the file or secrets each time
      # a new branch is added or removed
      run: |
        # Read branches from local file
        branches=$(cat system-tests-branches-list.txt)
        echo "branches found in system-tests-branches-list.txt: $branches"

        # Split branches into an array
        IFS=',' read -ra branches_array <<< "$branches"

        # Get the first branch in the list to work on
        first_branch="${branches_array[0]}"
        echo "working on $first_branch"

        # Remove the first branch from the list
        branches_array=("${branches_array[@]:1}")

        # Add the first branch at the end of the list
        branches_array+=("$first_branch")

        # Join branches back into a string
        branches=$(printf ",%s" "${branches_array[@]}")
        branches=${branches:1}

        # Output the new list of branches
        echo "$branches"

        # Write new branches order to a local file
        echo "$branches" | cat > system-tests-branches-list.txt

        # Set output
        echo "name=$(echo $first_branch)" >> $GITHUB_OUTPUT

    - name: Override remote file from local resolved branch list
      run: |
        # Override the remote file with the new list of branches
        sshpass \
          -p "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          scp \
          -o StrictHostKeyChecking=no system-tests-branches-list.txt \
          ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}@${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }}:/home/iguazio/ci/

    # checking out to base branch and not the target(resolved) branch, to be able to run the changed preparation code
    # before merging the changes to upstream.
    - name: Checkout base branch
      uses: actions/checkout@v7

    - name: Install automation scripts dependencies
      run: |
        uv venv venv --seed --clear
        . venv/bin/activate
        make install-automation-requirements

    - name: Generate GitHub App token for build lookup
      id: build-lookup-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: mlrun
        repositories: mlrun,ui

    - name: Extract git hashes from upstream and latest version
      id: git_upstream_info
      env:
        GH_TOKEN: ${{ steps.build-lookup-token.outputs.token }}
        MLRUN_BRANCH: ${{ steps.current-branch.outputs.name }}
      run: |
        set -euo pipefail

        if [[ -z "${GH_TOKEN}" ]]; then
          echo "GitHub App token is empty; cannot look up successful image builds." >&2
          exit 1
        fi

        workdir="$(mktemp -d)"
        trap 'rm -rf "$workdir"' EXIT

        # Newest commit on the branch whose Build workflow succeeded and whose
        # commit-tagged image is on ghcr.io. A newer commit whose image build failed
        # is skipped. The previous selector used the newest commit older than 3 hours
        # and ignored the build result.
        # Build runs git rev-parse --short=8 on a default actions/checkout
        # (fetch-depth 1). The image tag is <prefix from that commit>-<first 8 hex chars>,
        # not the prefix currently at the branch tip.
        # A successful workflow_dispatch can still be a release rebuild that pushes
        # only an explicit version. UI names every such run "Build", so the run title
        # cannot tell those apart. Require the commit tag to exist before selecting it.
        # One prefix is emitted for both images, taken from the selected MLRun commit.
        # The UI image must have been published with that same prefix.

        # Prints nothing and returns 1 when the tag is absent.
        # Returns 2 when the registry cannot be queried.
        ghcr_commit_tag_status() {
          local image="$1"
          local tag="$2"
          local token http_code
          if ! token="$(curl --retry 3 --retry-delay 2 --silent --show-error --fail \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${image}:pull" \
            | jq -r '.token // empty')"; then
            echo "Failed to get a GHCR pull token for ${image}" >&2
            return 2
          fi
          if [[ -z "$token" ]]; then
            echo "GHCR pull token for ${image} was empty" >&2
            return 2
          fi
          if ! http_code="$(curl --retry 3 --retry-delay 2 --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${image}/manifests/${tag}")"; then
            echo "GHCR request failed for ${image}:${tag}" >&2
            return 2
          fi
          case "$http_code" in
            200) return 0 ;;
            404) return 1 ;;
            *)
              echo "GHCR lookup for ${image}:${tag} returned HTTP ${http_code}" >&2
              return 2
              ;;
          esac
        }

        resolve_built_short_hash() {
          local repo="$1"
          local pinned_prefix="${2:-}"
          local image
          local clone_dir="${workdir}/${repo}"
          local runs_json qualifying_shas candidate_shas sha short_hash prefix tag status

          case "$repo" in
            mlrun) image="mlrun/mlrun" ;;
            ui) image="mlrun/mlrun-ui" ;;
            *)
              echo "Unknown repo ${repo}" >&2
              return 1
              ;;
          esac

          GIT_TERMINAL_PROMPT=0 git clone --quiet --single-branch \
            --branch "$MLRUN_BRANCH" \
            "https://github.com/mlrun/${repo}.git" "$clone_dir"

          runs_json="$(curl --retry 3 --retry-delay 2 --silent --show-error --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode "branch=${MLRUN_BRANCH}" \
            --data-urlencode "status=success" \
            --data-urlencode "per_page=100" \
            "https://api.github.com/repos/mlrun/${repo}/actions/workflows/build.yaml/runs")"

          qualifying_shas="$(jq -r '
            .workflow_runs[]?
            | select(.event == "push" or .event == "workflow_dispatch")
            | .head_sha
          ' <<<"$runs_json")"

          # Newest-first commits that have a successful Build run.
          candidate_shas="$(
            git -C "$clone_dir" rev-list HEAD | awk '
              NR == FNR {
                if ($0 != "") built[$0] = 1
                next
              }
              built[$0] { print }
            ' <(printf '%s\n' "$qualifying_shas") -
          )"

          while read -r sha; do
            [[ -z "$sha" ]] && continue
            short_hash="$(printf '%s' "$sha" | cut -c1-8)"
            if [[ -n "$pinned_prefix" ]]; then
              prefix="$pinned_prefix"
            elif ! prefix="$(git -C "$clone_dir" show "${sha}:automation/version/unstable_version_prefix" 2>/dev/null | tr -d '[:space:]')"; then
              echo "Skipping ${sha}: could not read unstable_version_prefix" >&2
              continue
            fi
            if [[ -z "$prefix" ]]; then
              echo "Skipping ${sha}: unstable_version_prefix is empty" >&2
              continue
            fi
            tag="${prefix}-${short_hash}"
            set +e
            ghcr_commit_tag_status "$image" "$tag"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              built_short_hash="$short_hash"
              if [[ -z "$pinned_prefix" ]]; then
                resolved_version_prefix="$prefix"
                resolved_full_sha="$sha"
              fi
              echo "Selected mlrun/${repo}@${MLRUN_BRANCH} ${built_short_hash} (${sha}) image ${image}:${tag}" >&2
              return 0
            fi
            if [[ "$status" -ne 1 ]]; then
              return "$status"
            fi
            echo "Skipping ${sha}: ${image}:${tag} is not on ghcr.io" >&2
          done <<< "$candidate_shas"

          echo "No commit on mlrun/${repo}@${MLRUN_BRANCH} has both a successful Build run and a commit-tagged ${image} image on ghcr.io" >&2
          return 1
        }

        built_short_hash=""
        resolved_version_prefix=""
        resolved_full_sha=""
        resolve_built_short_hash mlrun
        mlrun_hash="$built_short_hash"
        resolve_built_short_hash ui "$resolved_version_prefix"
        ui_hash="$built_short_hash"

        if [[ ! "$resolved_full_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Refusing mlrun commit '${resolved_full_sha}'" >&2
          exit 1
        fi
        # The branch tip is tested at any age when its image exists. A quiet
        # release branch must still run. The 24h cap applies only to a fallback:
        # the tip had no published image, and the newest older image is stale.
        # Do not walk further back than that commit.
        tip_sha="$(git -C "${workdir}/mlrun" rev-parse HEAD)"
        commit_epoch="$(git -C "${workdir}/mlrun" log -1 --format=%ct "$resolved_full_sha")"
        age_seconds="$(( $(date +%s) - commit_epoch ))"
        max_age_seconds=86400
        if [[ "$resolved_full_sha" != "$tip_sha" && "$age_seconds" -gt "$max_age_seconds" ]]; then
          echo "::error::Selected commit ${resolved_full_sha} on ${MLRUN_BRANCH} is $((age_seconds / 3600))h old. Refusing a fallback older than 24h while tip ${tip_sha} has no published image." >&2
          exit 1
        fi
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "### Enterprise system test commit"
            echo ""
            echo "- Branch: \`${MLRUN_BRANCH}\`"
            echo "- Tested commit: \`${resolved_full_sha}\` (\`${mlrun_hash}\`)"
            echo "- Branch tip: \`${tip_sha}\`"
            if [[ "$resolved_full_sha" == "$tip_sha" ]]; then
              echo "- Testing the branch tip."
            else
              echo "- The branch tip was not tested. Its image build did not publish a commit-tagged image."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [[ "$resolved_full_sha" != "$tip_sha" ]]; then
          echo "::warning title=System tests are not on the branch tip::Testing ${mlrun_hash} instead of ${tip_sha:0:8} on ${MLRUN_BRANCH}." >&2
        fi

        if [[ ! "$mlrun_hash" =~ ^[0-9a-f]{8}$ ]]; then
          echo "Refusing mlrun hash '${mlrun_hash}'" >&2
          exit 1
        fi
        if [[ ! "$ui_hash" =~ ^[0-9a-f]{8}$ ]]; then
          echo "Refusing ui hash '${ui_hash}'" >&2
          exit 1
        fi
        if [[ -z "$resolved_version_prefix" ]]; then
          echo "unstable version prefix was not resolved" >&2
          exit 1
        fi

        {
          echo "mlrun_hash=${mlrun_hash}"
          echo "mlrun_full_sha=${resolved_full_sha}"
          echo "ui_hash=${ui_hash}"
          echo "unstable_version_prefix=${resolved_version_prefix}"
        } >> "$GITHUB_OUTPUT"

    - name: Set computed versions params
      id: computed_params
      run: |
        action_mlrun_hash=${{ steps.git_action_info.outputs.mlrun_hash }} && \
        upstream_mlrun_hash=${{ steps.git_upstream_info.outputs.mlrun_hash }} && \
        export mlrun_hash=${upstream_mlrun_hash:-`echo $action_mlrun_hash`}
        echo "mlrun_hash=$(echo $mlrun_hash)" >> $GITHUB_OUTPUT
        action_mlrun_ui_hash=${{ steps.git_action_ui_info.outputs.ui_hash }} && \
        upstream_mlrun_ui_hash=${{ steps.git_upstream_info.outputs.ui_hash }} && \
        export ui_hash=${upstream_mlrun_ui_hash:-`echo $action_mlrun_ui_hash`}
        echo "ui_hash=$(echo $ui_hash)" >> $GITHUB_OUTPUT
        echo "mlrun_version=$(echo ${{ steps.git_upstream_info.outputs.unstable_version_prefix }}+$mlrun_hash)" >> $GITHUB_OUTPUT
        echo "mlrun_docker_tag=$(echo ${{ steps.git_upstream_info.outputs.unstable_version_prefix }}-$mlrun_hash)" >> $GITHUB_OUTPUT
        echo "mlrun_ui_version=${{ steps.git_upstream_info.outputs.unstable_version_prefix }}-$ui_hash" >> $GITHUB_OUTPUT
        echo "mlrun_docker_registry=$( \
          effective_docker_registry="${INPUT_DOCKER_REGISTRY:-$SECRET_DOCKER_REGISTRY}" && \
          echo "${effective_docker_registry:-ghcr.io/}")" >> $GITHUB_OUTPUT
        echo "mlrun_system_tests_clean_resources=$( \
          input_system_tests_clean_resources=$INPUT_CLEAN_RESOURCES_IN_TEARDOWN && \
          echo ${input_system_tests_clean_resources:-true})" >> $GITHUB_OUTPUT
        echo "override_iguazio_version=$INPUT_OVERRIDE_IGUAZIO_VERSION" >> $GITHUB_OUTPUT
      env:
        SECRET_DOCKER_REGISTRY: ${{ secrets.SYSTEM_TESTS_ENTERPRISE_GHCR_PROXY_REGISTRY }}
        INPUT_DOCKER_REGISTRY: ${{ github.event.inputs.docker_registry }}
        INPUT_OVERRIDE_IGUAZIO_VERSION: ${{ github.event.inputs.override_iguazio_version }}
        INPUT_CLEAN_RESOURCES_IN_TEARDOWN: ${{ github.event.inputs.clean_resources_in_teardown }}

    - name: Prepare System Test Environment and Install MLRun
      env:
        IP_ADDR_PREFIX: ${{ secrets.IP_ADDR_PREFIX }}

      # AWS credentials are automatically available from configure-aws-credentials action
      timeout-minutes: 50
      run: |
        . venv/bin/activate
        python automation/system_test/prepare.py run \
          --data-cluster-ip "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }}" \
          --data-cluster-ssh-username "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}" \
          --data-cluster-ssh-password "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          --provctl-download-url "${{ secrets.LATEST_SYSTEM_TEST_PROVCTL_DOWNLOAD_PATH }}" \
          --username "${{ secrets.LATEST_SYSTEM_TEST_USERNAME }}" \
          --access-key "${{ secrets.LATEST_SYSTEM_TEST_ACCESS_KEY }}" \
          --aws-access-key-id "${{ steps.creds.outputs.aws-access-key-id }}" \
          --aws-secret-access-key "${{ steps.creds.outputs.aws-secret-access-key }}" \
          --aws-oidc-access-token "${{ steps.creds.outputs.aws-session-token }}" \
          --iguazio-version "${{ steps.computed_params.outputs.iguazio_version }}" \
          --mlrun-version "${{ steps.computed_params.outputs.mlrun_version }}" \
          --mlrun-ui-version "${{ steps.computed_params.outputs.mlrun_ui_version }}" \
          --mlrun-commit "${{ steps.computed_params.outputs.mlrun_hash }}" \
          --override-image-registry "${{ steps.computed_params.outputs.mlrun_docker_registry }}"

    - name: Generate GitHub App Token
      id: github-app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.GH_APP_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: mlrun,private-system-tests

    - name: Prepare System Test env.yml and MLRun installation from current branch
      timeout-minutes: 5
      run: |
        . venv/bin/activate
        python automation/system_test/prepare.py env \
          --data-cluster-ip "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }}" \
          --data-cluster-ssh-username "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}" \
          --data-cluster-ssh-password "${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}" \
          --username "${{ secrets.LATEST_SYSTEM_TEST_USERNAME }}" \
          --access-key "${{ secrets.LATEST_SYSTEM_TEST_ACCESS_KEY }}" \
          --slack-webhook-url "${{ secrets.LATEST_SYSTEM_TEST_SLACK_WEBHOOK_URL }}" \
          --branch "${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunBranch }}" \
          --github-access-token "${{ steps.github-app-token.outputs.token }}" \
          --openai-base-url "${{ secrets.OPENAI_BASE_URL }}" \
          --openai-api-key "${{ secrets.OPENAI_API_KEY }}" \
          --save-to-path "$GITHUB_WORKSPACE/env.yml"

    - name: Encrypt file
      id: encrypt_file
      run: |
        gpg \
          --batch \
          --passphrase "${{ env.GPG_PASSPHRASE }}" \
          --output "$GITHUB_WORKSPACE/env.yml.gpg" \
          --symmetric "$GITHUB_WORKSPACE/env.yml"

        echo "env_file_path=$(echo $GITHUB_WORKSPACE/env.yml.gpg)" >> $GITHUB_OUTPUT
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Upload env file
      uses: actions/upload-artifact@v7
      with:
        name: env
        path: "${{ steps.encrypt_file.outputs.env_file_path }}"
        if-no-files-found: error

    outputs:
      mlrunVersion: ${{ steps.computed_params.outputs.mlrun_version }}
      mlrunBranch: ${{ steps.current-branch.outputs.name }}
      mlrunCommit: ${{ steps.git_upstream_info.outputs.mlrun_full_sha }}
      mlrunHash: ${{ steps.git_upstream_info.outputs.mlrun_hash }}
      mlrunSystemTestsCleanResources: ${{ steps.computed_params.outputs.mlrun_system_tests_clean_resources }}

  run-system-tests-enterprise-ci:
    # When increasing the timeout make sure it's not larger than the schedule cron interval
    timeout-minutes: 360
    name: Test ${{ matrix.test_component }} [${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunBranch }}@${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunHash }}]
    # requires prepare to finish before starting
    needs: [prepare-system-tests-enterprise-ci]
    runs-on: [ self-hosted, Linux, mlrun-igz-ci ]
    container:
      image: gcr.io/iguazio/python:3.11
    # let's not run this on every fork, change to your fork when developing
    if: github.repository == 'mlrun/mlrun' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test_component:
        - api
        - runtimes
        - projects
        - model_monitoring
        - examples
        - backwards_compatibility
        - datastore
        - logs
        - feature_store
        - alerts
    steps:
    - name: Install Dependencies
      run: |
        # gnupg         for decrypting env.yml.gpg
        # nodejs        for installing github action dependencies
        # graphviz      for generating graphs (feature store tests)
        # git-core      for cloning repos and etc, required by many suites
        # gcc, make     for installing python packages
        # jq, openssl   for github-app-token.sh (token refresh daemon)
        apt-get update -qqy && \
          apt-get install -y \
            curl \
            gnupg \
            nodejs \
            graphviz \
            git-core \
            gcc \
            make \
            jq \
            openssl

    - uses: actions/checkout@v7
      # Check out the commit whose images were installed. A branch-tip checkout would
      # run tests from a different SDK than the one deployed in the previous job.
      with:
        ref: ${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunCommit }}

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # 10.3.2
      with:
        enable-cache: true
        python-version: 3.11
        cache-dependency-glob: "**/*requirements*.txt"

    - uses: actions/download-artifact@v8
      with:
        name: env
        path: /tmp

    - name: Decrypt file
      run: |
        gpg \
          --batch \
          --passphrase "${{ env.GPG_PASSPHRASE }}" \
          --output "$GITHUB_WORKSPACE/tests/system/env.yml" \
          --decrypt "/tmp/env.yml.gpg"

        # ensure file is created
        test -f "$GITHUB_WORKSPACE/tests/system/env.yml"
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Start GitHub App token refresh daemon
      shell: bash
      env:
        GH_APP_ID: ${{ secrets.GH_APP_ID }}
        GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      run: |
        source .github/scripts/github-app-token.sh
        DAEMON_PID=$(start_token_refresh_daemon \
          "/tmp/.github-app-token" \
          "$GITHUB_WORKSPACE/tests/system/env.yml" \
          "MLRUN_SYSTEM_TESTS_GIT_TOKEN" \
          "3300" \
          "${{ github.repository_owner }}" \
          "mlrun,private-system-tests")
        echo "Token refresh daemon started (PID: ${DAEMON_PID})"
        echo "TOKEN_REFRESH_PID=${DAEMON_PID}" >> $GITHUB_ENV

    - name: Pre Tests Requirements
      run: |

        # due to
        # https://github.com/git/git/commit/8959555cee7ec045958f9b6dd62e541affb7e7d9
        # ensure mlrun git is safe to use
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        uv venv venv --seed --clear
        . venv/bin/activate
        MLRUN_VERSION="${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunVersion }}" \
          make install-requirements install-complete-requirements update-version-file

    - name: Run System Tests
      env:
        LATEST_SYSTEM_TEST_DATA_CLUSTER_IP: ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_IP }}
        LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME: ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_USERNAME }}
        LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD: ${{ secrets.LATEST_SYSTEM_TEST_DATA_CLUSTER_SSH_PASSWORD }}
      run: |
        . venv/bin/activate
        MLRUN_SYSTEM_TESTS_GITHUB_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
        MLRUN_SYSTEM_TESTS_CLEAN_RESOURCES="${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunSystemTestsCleanResources }}" \
        MLRUN_VERSION="${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunVersion }}" \
        MLRUN_SYSTEM_TESTS_COMPONENT="${{ matrix.test_component }}" \
        MLRUN_SYSTEM_TESTS_BRANCH="${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunBranch }}" \
        MLRUN_SYSTEM_TESTS_COMMIT="${{ needs.prepare-system-tests-enterprise-ci.outputs.mlrunCommit }}" \
          make test-system

# Temporary workflow to test GitHub App JWT token refresh logic.
# Remove this file after validation.

name: Test Token Refresh (dry-run)

on:
  workflow_dispatch:
    inputs:
      token_lifetime_seconds:
        description: 'Seconds before forcing a token refresh (default 120 = 2 min, production would be 3300)'
        required: false
        default: '120'
        type: string
      poll_cycles:
        description: 'Number of poll cycles to run (each cycle is 10s)'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  test-token-refresh:
    name: Test JWT and token refresh
    runs-on: mlrun-release
    steps:
      - name: Test GitHub App token generation and refresh
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          OWNER: ${{ github.repository_owner }}
          TOKEN_LIFETIME: ${{ inputs.token_lifetime_seconds }}
          POLL_CYCLES: ${{ inputs.poll_cycles }}
        run: |
          set -euo pipefail

          generate_jwt() {
            local now=$(date +%s)
            local iat=$((now - 60))
            local exp=$((now + 540))  # 9 minutes (max 10)

            local header=$(echo -n '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
            local payload=$(echo -n "{\"iat\":${iat},\"exp\":${exp},\"iss\":\"${GH_APP_ID}\"}" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
            local unsigned="${header}.${payload}"
            local signature=$(echo -n "${unsigned}" | openssl dgst -sha256 -sign <(echo "${GH_APP_PRIVATE_KEY}") | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
            echo "${unsigned}.${signature}"
          }

          generate_installation_token() {
            local jwt=$(generate_jwt)
            local installation_id=$(curl -sf -H "Authorization: Bearer ${jwt}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/app/installations" \
              | jq -r ".[] | select(.account.login==\"${OWNER}\") | .id")

            if [ -z "${installation_id}" ]; then
              echo "::error::Failed to find installation for owner ${OWNER}"
              return 1
            fi

            curl -sf -X POST \
              -H "Authorization: Bearer ${jwt}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/app/installations/${installation_id}/access_tokens" \
              -d "{\"repositories\":[\"ui\"]}" \
              | jq -r '.token'
          }

          REFRESH_COUNT=0

          echo "=== Test Configuration ==="
          echo "Token lifetime before refresh: ${TOKEN_LIFETIME}s"
          echo "Poll cycles: ${POLL_CYCLES} (10s each = $((POLL_CYCLES * 10))s total)"
          echo ""

          echo "--- Generating initial installation token ---"
          TOKEN=$(generate_installation_token)
          TOKEN_CREATED_AT=$(date +%s)

          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::Failed to generate initial token"
            exit 1
          fi
          echo "Initial token generated successfully (${#TOKEN} chars)"

          echo "--- Verifying token can access mlrun/ui ---"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/ui")
          echo "GET /repos/${OWNER}/ui returned: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Token cannot access ${OWNER}/ui (HTTP ${HTTP_CODE})"
            exit 1
          fi

          echo ""
          echo "--- Starting poll loop (simulating trigger-and-wait) ---"
          for i in $(seq 1 ${POLL_CYCLES}); do
            ELAPSED=$(( $(date +%s) - TOKEN_CREATED_AT ))

            if [ ${ELAPSED} -ge ${TOKEN_LIFETIME} ]; then
              REFRESH_COUNT=$((REFRESH_COUNT + 1))
              echo "[cycle ${i}/${POLL_CYCLES}] Token age: ${ELAPSED}s >= ${TOKEN_LIFETIME}s — REFRESHING (refresh #${REFRESH_COUNT})"
              TOKEN=$(generate_installation_token)
              TOKEN_CREATED_AT=$(date +%s)

              if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
                echo "::error::Failed to refresh token on refresh #${REFRESH_COUNT}"
                exit 1
              fi
              echo "[cycle ${i}/${POLL_CYCLES}] New token generated successfully"
            fi

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/ui/actions/workflows/build.yaml")

            echo "[cycle ${i}/${POLL_CYCLES}] Elapsed: ${ELAPSED}s | API check: HTTP ${HTTP_CODE} | Refreshes so far: ${REFRESH_COUNT}"

            if [ "${HTTP_CODE}" != "200" ]; then
              echo "::error::API call failed with HTTP ${HTTP_CODE} at cycle ${i}"
              exit 1
            fi

            sleep 10
          done

          echo ""
          echo "=== Test Complete ==="
          echo "Total poll cycles: ${POLL_CYCLES}"
          echo "Total token refreshes: ${REFRESH_COUNT}"
          echo "All API calls returned 200"
          echo "Token refresh mechanism is working correctly"

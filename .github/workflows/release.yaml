name: Create Release
run-name: Create Release

permissions:
  contents: write
  actions: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      release_candidate_promotion:
        description: 'The tag to promote to a full release, must be an existing release candidate tag'
        required: true
        default: 'rc-v1.13.205-18222610666-7a5dabe5'
        type: string
      skip_images:
        description: 'Comma separated list of images to skip building, example with all possible images: mlrun,api,models,jupyter,test'
        default: ''
        type: string
jobs:

  Extract-Version:
    name: Extract Release Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.extract.outputs.release_version }}
      rc_tag: ${{ steps.extract.outputs.rc_tag }}
    steps:
      - name: Extract version from RC tag
        id: extract
        env:
          RELEASE_CANDIDATE_INPUT: ${{ inputs.release_candidate_promotion || 'rc-v1.13.205-18222610666-7a5dabe5' }}
        run: |
          echo "🎯 Trigger: ${{ github.event_name }}"
          echo "🏷️ Release candidate to promote: $RELEASE_CANDIDATE_INPUT"

          # Extract version from RC tag (e.g., rc-v1.13.205-18222610666-7a5dabe5 → v1.13.205)
          RC_TAG=$RELEASE_CANDIDATE_INPUT
          RELEASE_VERSION=$(echo "$RC_TAG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')

          echo "📦 Extracted version: $RELEASE_VERSION"
          echo "🏷️ Original RC tag: $RC_TAG"

          # Validate version format
          if [[ ! $RELEASE_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $RELEASE_VERSION"
            exit 1
          fi

          echo "✅ Version validation passed!"
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "rc_tag=$RC_TAG" >> $GITHUB_OUTPUT

  Matrix-Prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: set-matrix
        uses: ./.github/actions/image-matrix-prep
        with:
          skip_images: ${{ inputs.skip_images }}

  Create-Release:
    runs-on: ubuntu-latest
    needs: [Extract-Version, Matrix-Prep]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.Matrix-Prep.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Docker login (ghcr)
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # 3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create-release
        if: matrix.image-name != 'test'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.Extract-Version.outputs.release_version }}
          RC_TAG: ${{ needs.Extract-Version.outputs.rc_tag }}
        run: |
          echo "🎯 Processing image: ${{ matrix.image-name }}"
          echo "🏷️ RC tag: $RC_TAG"
          echo "📦 Release version: $RELEASE_VERSION"

          # Re-tag images from RC to release (keeps both tags)
          echo "🏷️ Creating new tag $RELEASE_VERSION for image ${{ matrix.image-name }}"
          echo "📋 Original RC tag: $RC_TAG (will remain unchanged)"
          echo "📋 New release tag: $RELEASE_VERSION"

          # Pull the RC image first
          echo "📥 Pulling RC image..."
          if [ "${{ matrix.image-name }}" = "api" ]; then
            image_name="mlrun-api"
          else
            image_name="${{ matrix.image-name }}"
          fi
          docker pull ghcr.io/mlrun/$image_name:$RC_TAG

          # Create new tag (original tag remains)
          echo "🏷️ Creating release tag..."
          docker tag ghcr.io/mlrun/$image_name:$RC_TAG ghcr.io/mlrun/$image_name:$RELEASE_VERSION

          # Push the new release tag
          echo "📤 Pushing release tag..."
          docker push ghcr.io/mlrun/$image_name:$RELEASE_VERSION

          echo "✅ Both tags now exist:"
          echo "   - RC: ghcr.io/mlrun/$image_name:$RC_TAG"
          echo "   - Release: ghcr.io/mlrun/$image_name:$RELEASE_VERSION"

          # TODO add changelog generation here as needed
          #gh release create "$RELEASE_VERSION" --repo mlrun/mlrun --title "Release $RELEASE_VERSION" --notes "Automated release created by GitHub Actions"
          echo "✅ Release created successfully!"

name: Build
run-name: Building commit ${{ github.event.pull_request.head.sha || github.sha }} on ${{ github.ref_name }} (${{ github.event_name }})

permissions:

  # Allow the action to assume AWS roles for ECR access
  id-token: write
  contents: read
  packages: write

env:
  DOCKER_REGISTRY: ${{ vars.REGISTRY_URL || 'ghcr.io/' }}

on:
  workflow_call:
    inputs:
      skip_images:
        description: 'Comma separated list of images to skip building, example with all possible images: mlrun,api,models,jupyter,test'
        default: ''
        type: string
      build_from_cache:
        description: 'Whether to build images from cache or not. Default: true, set to false only if required because that will cause a significant increase in build time'
        default: 'true'
        type: string
      cache_tag_suffix:
        description: 'The suffix to add to the cache tag'
        default: ''
        type: string
      tag:
        description: 'The tag of the build, if empty it will be derived from the branch name'
        required: true
        type: string

jobs:
  matrix_prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: set-matrix
        uses: ./.github/actions/image-matrix-prep
        with:
          skip_images: ${{ inputs.skip_images }}

  Controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Fetch full history for proper git operations and conventional commit checking
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dev requirements
        run: |
          pip install -r ci-requirements.txt

      - name: Check conventional commits (with committizen )
        run: |
          # Debug git state
          echo "=== Git Debug Info ==="
          echo "Current branch: $(git branch --show-current)"
          echo "Available remotes: $(git remote -v)"
          echo "Available remote branches: $(git branch -r)"
          echo "Default remote HEAD: $(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null || echo 'Not set')"

          # Try to set up the default branch reference if missing
          if ! git symbolic-ref refs/remotes/origin/HEAD >/dev/null 2>&1; then
            echo "Setting up default remote HEAD..."
            git remote set-head origin -a
          fi

          # For PRs, be explicit about what to check
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "=== PR Context ==="
            echo "PR base: ${{ github.event.pull_request.base.ref }}"
            echo "PR head: ${{ github.event.pull_request.head.ref }}"
            echo "Base SHA: ${{ github.event.pull_request.base.sha }}"
            echo "Head SHA: ${{ github.event.pull_request.head.sha }}"

            # Check commits in PR range
            echo "Checking commits in PR range..."
            cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            echo "=== Branch Push Context ==="
            echo "Checking commits using default range..."
            cz check --use-default-range
          fi

      - name: Check PR title with committizen
        if: github.event_name == 'pull_request'
        run: |
          # This is to avoid that a PR got squashed and the commit message doesn't follow conventional commits
          cz check -m "${{ github.event.pull_request.title }}"

  build-images:
    name: Build and push image - ${{ matrix.image-name }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: matrix_prep
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v5
      with:
        # Fetch full history for proper git operations and version calculation
        fetch-depth: 0

    # since github-actions gives us 14G only, and fills it up with some garbage
    - name: Freeing up disk space
      # This takes time so only enable it when really needed
      if: false
      run: |
        "${GITHUB_WORKSPACE}/automation/scripts/github_workflow_free_space.sh"

    - name: Install dependencies
      run: |
        # Install basic tools required by Makefile shell commands
        sudo apt-get update
        sudo apt-get install -y curl jq shellcheck gawk sed coreutils

    - name: Resolve docker cache tag
      id: docker_cache
      run: |
        export version_suffix=$(echo "$GITHUB_REF_NAME" | grep -E "^[0-9]+\.[0-9]+\.x$" | tr -d '.');
        export unstable_tag="unstable-cache${version_suffix:+-$version_suffix}${INPUT_CACHE_TAG_SUFFIX:+-$INPUT_CACHE_TAG_SUFFIX}"
        export build_from_cache=$(if [ -z "$INPUT_BUILD_FROM_CACHE" ]; then echo "true" ; else echo "$INPUT_BUILD_FROM_CACHE";fi);
        export no_cache=$(if [ "$build_from_cache" = "false" ]; then echo "true" ; else echo "";fi);
        echo "tag=$(echo $unstable_tag)" >> $GITHUB_OUTPUT
        echo "no_cache=$(echo $no_cache)" >> $GITHUB_OUTPUT
      env:
        INPUT_BUILD_FROM_CACHE: ${{ inputs.build_from_cache }}
        INPUT_CACHE_TAG_SUFFIX: ${{ inputs.cache_tag_suffix }}

    - name: Set computed versions params
      id: computed_params
      run: |
        # if tag input is specified use it, otherwise compute it
        echo "Using provided tag: ${{ inputs.tag }}"
        echo "mlrun_version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
        # Docker repo is always "mlrun"
        echo "mlrun_docker_repo=mlrun" >> $GITHUB_OUTPUT
        echo "mlrun_cache_date=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Docker login (ghcr)
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # 3.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and conditionally push images
      if: matrix.image-name != 'test'
      run: |
        # For PRs: only build. For branches: build and push
        echo "Building Docker image for ${{ matrix.image-name }}"
        export MLRUN_PUSH_DOCKER_CACHE_IMAGE="true"
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          TARGET="${{ matrix.image-name }}"
        else
          TARGET="push-${{ matrix.image-name }}"
        fi

        echo "Make target: $TARGET"
        MLRUN_CACHE_DATE=${{ steps.computed_params.outputs.mlrun_cache_date }} \
        MLRUN_DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }} \
        MLRUN_DOCKER_CACHE_FROM_REGISTRY=${{ env.DOCKER_REGISTRY }} \
        MLRUN_DOCKER_REPO=${{ steps.computed_params.outputs.mlrun_docker_repo }} \
        MLRUN_VERSION=${{ steps.computed_params.outputs.mlrun_version }} \
        MLRUN_DOCKER_CACHE_FROM_TAG=${{ steps.docker_cache.outputs.tag }} \
        MLRUN_NO_CACHE=${{ steps.docker_cache.outputs.no_cache }} \
        MLRUN_PYTHON_VERSION=${{ matrix.python-version }} \
        INCLUDE_PYTHON_VERSION_SUFFIX=${{ matrix.include-suffix }} \
        make $TARGET

name: Build Release Candidate

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:
    inputs:
      skip_images:
        description: 'Comma separated list of images to skip building, example with all possible images: mlrun,api,models,jupyter,test'
        default: ''
        type: string
      build_from_cache:
        description: 'Whether to build images from cache or not. Default: true'
        default: 'true'
        type: string

jobs:
  build-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Get Version
        uses: ./.github/actions/get-version
        id: get-version

      - name: Build Snapshot Images
        uses: ./.github/workflows/build.yaml
        with:
            tag: rc-v$current_version-${{ github.run_id }}-${{ steps.get-version.outputs.mlrun_version }} 

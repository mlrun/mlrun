name: Get current version
description: Get the current version
outputs:
  mlrun_version:
    description: 'The current mlrun version'
    value: ${{ steps.get-version.outputs.mlrun_version }}
  mlrun_commit_hash:
    description: 'The short commit hash of the current mlrun version'
    value: ${{ steps.git_info.outputs.mlrun_commit_hash }}
  mlrun_commit_hash_full:
    description: 'The full commit hash of the current mlrun version'
    value: ${{ steps.git_info.outputs.mlrun_commit_hash_full }}
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump-my-version==1.2.4
      shell: bash

    - name: Extract git hash, ref and latest version
      shell: bash
      id: git_info
      run: |
        # Get the actual commit SHA - PR head if available, otherwise regular SHA
        ACTUAL_COMMIT_ID="${{ github.event.pull_request.head.sha || github.sha }}"
        SHORT_COMMIT_ID=$(echo "${ACTUAL_COMMIT_ID}" | cut -c1-8)
        
        echo "🎯 ACTUAL COMMIT: ${ACTUAL_COMMIT_ID}"
        echo "📝 Short commit: ${SHORT_COMMIT_ID}"
        echo "⚡ Event: ${{ github.event_name }}"
        
        echo "mlrun_commit_hash_full=${ACTUAL_COMMIT_ID}" >> $GITHUB_OUTPUT
        echo "mlrun_commit_hash=${SHORT_COMMIT_ID}" >> $GITHUB_OUTPUT

    - id: get-version
      shell: bash
      run: |
        # Get current version using bumpversion
        current_version=$(bumpversion --dry-run --list patch | grep current_version | sed 's/current_version=//')
        echo "mlrun_version=${current_version}" >> $GITHUB_OUTPUT

